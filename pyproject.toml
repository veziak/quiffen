[project]
name = "quiffen"
version = "2.0.13"
description = "Quiffen"
authors = [{ name = "Isaac Harris-Holt", email = "isaac@harris-holt.com" }]
license = "GPL-3.0-or-later"
readme = "README.rst"
requires-python = ">=3.11"
keywords = ["qif", "finance", "data processing"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
]
dependencies = [
  "pydantic>=1.10.2,<2",
  "python-dateutil>=4.0.0,<5",
]

[project.urls]
Homepage = "https://github.com/isaacharrisholt/quiffen"
Repository = "https://github.com/isaacharrisholt/quiffen"
Documentation = "https://quiffen.readthedocs.io/en/latest/"

[dependency-groups]
dev = [
  "pytest>=7.2.0,<8",
  "black>=24.0.0,<25",
  "isort>=5.12.0,<6",
  "ruff>=0.7.0,<0.8",
  "tox>=4.4.6,<5",
  "tox-uv>=1.0.0",
  "pyright>=1.1.296,<2",
  "pre-commit>=3.1.1,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quiffen"]

[tool.isort]
profile = "black"
include_trailing_comma = true

[tool.ruff]
line-length = 88

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"] # Ignore unused imports in __init__.py

[tool.pyright]
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
