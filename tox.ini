[tox]
requires =
    tox>=4
    tox-uv>=1
envlist = py{311,312,313,314}, black, ruff, pyright, isort

[testenv]
runner = uv-venv-lock-runner
dependency_groups = dev
commands =
    pytest --basetemp="{envtmpdir}" tests

[testenv:pyright]
runner = uv-venv-lock-runner
dependency_groups = dev
commands =
    pyright --project "{toxinidir}" quiffen

[testenv:ruff]
skip_install = true
deps = ruff
commands = ruff check "{toxinidir}"

[testenv:black]
skip_install = true
deps = black
commands = black --check --diff "{toxinidir}"

[testenv:isort]
skip_install = true
deps = isort
commands = isort --check-only --diff "{toxinidir}"
